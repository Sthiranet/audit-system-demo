<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sthiranet · Group Audit Trail Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%23D4A574'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◆</span>
    <span class="brand-name">Sthiranet</span>
    <span class="brand-sub">Group audit trail · live demo</span>
  </div>
  <div class="top-actions">
    <label class="switch" title="Each subsidiary captures a few changes and seals a batch every 10 seconds">
      <input type="checkbox" id="auto-toggle"><span class="slider"></span><span>Auto-anchor every 10 s</span>
    </label>
    <button id="auditor-btn" class="btn btn-purple">Add auditor</button>
    <button id="reset-btn" class="btn btn-ghost">Reset demo</button>
  </div>
</header>

<section id="network" class="network" aria-label="Network"></section>

<div class="main">
  <section class="workspace">
    <nav class="tabs" id="tabs">
      <button data-tab="capture" class="active"><b>1</b> Capture &amp; batch</button>
      <button data-tab="ledger"><b>2</b> Ledger</button>
      <button data-tab="trail"><b>3</b> Off-ledger audit trail</button>
      <button data-tab="verify"><b>4</b> Verify</button>
      <span class="tabs-spacer"></span>
      <button id="activity-toggle" class="activity-toggle" title="Show or hide the activity panel">Hide activity</button>
    </nav>
    <div id="view" class="view"></div>
  </section>
  <aside class="activity">
    <h3>Activity</h3>
    <ol id="activity"></ol>
  </aside>
</div>

<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
